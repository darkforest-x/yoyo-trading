<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>W10 迁移复审</title>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; background: #ecebe6; }
  header { height: 40px; padding: 0 12px; background: #111; color: #fff; display: flex; align-items: center; gap: 16px; }
  #work { height: calc(100% - 40px - 148px); display: flex; gap: 10px; padding: 8px 12px; box-sizing: border-box; }
  .col { flex: 1 1 50%; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .cap { margin: 0 0 4px; font-size: 12px; color: #444; }
  img { flex: 1 1 auto; width: 100%; min-height: 0; object-fit: contain; object-position: top center; background: #fff; border: 1px solid #bbb; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; height: 148px; background: #fff; border-top: 2px solid #111;
           display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; box-sizing: border-box; }
  footer button { height: 48px; min-width: 64px; font-size: 16px; border: 0; border-radius: 8px; cursor: pointer; }
  #a { background: #1b7f3a; color: #fff; }
  #n { background: #c62828; color: #fff; }
  #i { background: #666; color: #fff; }
  #meta { font-size: 13px; line-height: 1.35; }
</style>
</head>
<body>
<header>
  <strong>legacy_migration_review</strong>
  <span id="progress">载入中…</span>
  <span id="flash"></span>
</header>
<div id="work">
  <div class="col">
    <p class="cap">左：参考图（前 50 + 后 120，可含未来；黄带=建议核心）</p>
    <img id="ctx" alt="context"/>
  </div>
  <div class="col">
    <p class="cap">右：固定 W10 模型图。槽 5–8 核心，第 9 根确认。训练导出无 overlay。</p>
    <img id="w10" alt="w10"/>
  </div>
</div>
<footer>
  <button id="prev">J 上</button>
  <button id="next">K 下</button>
  <button id="left">[ 左移</button>
  <button id="right">] 右移</button>
  <button id="a">A 接受 SIGNAL</button>
  <button id="n">N → NO_SIGNAL</button>
  <button id="i">I IGNORE</button>
  <button id="undo">U 撤销</button>
  <button id="save">S 保存</button>
  <button id="exp">导出 JSON</button>
  <div id="meta"></div>
</footer>
<script>
let tasks=[], idx=0, shift=0, ready=false, lastAction=null;
const saved={};
function $(id){ return document.getElementById(id); }
function flash(t){ $("flash").textContent = t; }
function coreStart(t){
  const s = t.core_start_bar;
  return (s==null ? null : s + shift);
}
function show(){
  if(!tasks.length){ flash("没有复审队列"); return; }
  const t=tasks[idx];
  const rec=saved[t.gold_id];
  $("progress").textContent=(idx+1)+" / "+tasks.length+"  已存 "+Object.keys(saved).length;
  const q="?shift="+shift+"&t="+Date.now();
  $("ctx").src="/img/context/"+t.gold_id+".png"+q;
  $("w10").src="/img/w10/"+t.gold_id+".png"+q;
  const cs=coreStart(t);
  $("meta").innerHTML =
    "来源 "+(t.source_annotation_type||"—")+
    " · 旧标签 "+(t.shape_label||"—")+
    " · 旧核心长度 "+(t.core_length==null?"—":t.core_length)+
    " · 旧 decision offset "+(t.legacy_decision_offset==null?"—":t.legacy_decision_offset)+
    "<br>起点（包含） "+(cs==null?"—":cs)+
    " · 终点（不含） "+(cs==null?"—":cs+4)+
    " · 核心 4 根 "+(cs==null?"—":[cs,cs+1,cs+2,cs+3].join("、"))+
    " · 确认 K "+(cs==null?"—":cs+4)+
    " · 迁移 "+(t.migration_status||"—")+
    " · 冲突 "+(t.conflict?"是":"否")+
    (rec ? " · 本张已存 "+rec.review_action : " · 未保存");
  flash(rec ? ("已存 "+rec.review_action) : "未保存");
}
function save(action){
  if(!ready) return;
  const t=tasks[idx];
  const body={gold_id:t.gold_id, action:action, core_start_bar:coreStart(t)};
  lastAction={idx, shift, action};
  fetch("/api/review/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(r=>r.json()).then(d=>{
      if(!d.ok){ flash(d.error||"保存失败"); return; }
      saved[t.gold_id]={review_action:action};
      flash("已存 "+action);
      if(idx<tasks.length-1){ idx++; shift=0; show(); }
    }).catch(e=>flash("网络失败 "+e));
}
$("prev").onclick=()=>{ if(idx>0){ idx--; shift=0; show(); } };
$("next").onclick=()=>{ if(idx<tasks.length-1){ idx++; shift=0; show(); } };
$("left").onclick=()=>{ shift-=1; show(); };
$("right").onclick=()=>{ shift+=1; show(); };
$("a").onclick=()=>save("A");
$("n").onclick=()=>save("N");
$("i").onclick=()=>save("I");
$("save").onclick=()=>save("A");
$("undo").onclick=()=>{ if(lastAction){ idx=lastAction.idx; shift=lastAction.shift; flash("已回到上一张，请再存"); show(); } };
$("exp").onclick=()=>{
  fetch("/api/export").then(r=>r.json()).then(d=>{
    const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="fixed_w10_review_export.json";
    a.click();
  });
};
document.addEventListener("keydown",ev=>{
  const k=ev.key;
  if(k==="a"||k==="A") save("A");
  else if(k==="n"||k==="N") save("N");
  else if(k==="i"||k==="I") save("I");
  else if(k==="j"||k==="J") { if(idx>0){ idx--; shift=0; show(); } }
  else if(k==="k"||k==="K") { if(idx<tasks.length-1){ idx++; shift=0; show(); } }
  else if(k==="[") { shift-=1; show(); }
  else if(k==="]") { shift+=1; show(); }
  else if(k==="u"||k==="U") $("undo").onclick();
  else if(k==="s"||k==="S") save("A");
});
fetch("/api/review/state").then(r=>r.json()).then(d=>{
  tasks=d.tasks||[];
  (d.tasks||[]).forEach(t=>{ if(t.saved) saved[t.gold_id]=t.saved; });
  ready=true;
  flash("已载入 "+tasks.length+" 张");
  show();
}).catch(e=>flash("载入失败 "+e));
</script>
</body>
</html>
